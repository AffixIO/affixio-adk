[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "affixio-adk"
version = "0.1.0"
description = "Fail-closed AffixIO authorization guard for Google ADK tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.2", "pytest-asyncio>=0.23", "twine>=5.1"]
google = ["google-adk>=2.0,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["affixio_adk"]
